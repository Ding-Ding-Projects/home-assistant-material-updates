<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo: page titles on a narrow screen</title>
<link rel="stylesheet" href="../../assets/demo.css">
<style>
.panel { width: 100%; max-width: 560px; margin: 16px auto 0; }
.row button { min-height: 48px; }
.frame { max-width: 100%; border: 1px dashed var(--out); border-radius: 16px; padding: 12px; background: var(--sl1); margin: 0 auto; }
.top { display: flex; align-items: center; gap: 12px; min-width: 0; }
.page-title { font-size: 22px; line-height: 28px; font-weight: 500; margin: 0; min-width: 0; }
.icon { width: 32px; height: 32px; border-radius: 50%; background: var(--sc); color: var(--on-sc); display: inline-flex; align-items: center; justify-content: center; flex: none; }
.width-field { max-width: 240px; }
</style>
</head>
<body>
<main class="demo" data-demo="narrow-titles">
  <h1>Page titles on a narrow screen</h1>
  <p class="muted">A demonstration with a made-up page title. Choose a build and a screen width, then compare the title.</p>

  <div class="row" role="group" aria-label="Which build behaves this way">
    <button type="button" class="chip" id="before" aria-pressed="false">Build 536</button>
    <button type="button" class="chip" id="after" aria-pressed="true">Build 542</button>
  </div>

  <section class="panel card">
    <label class="field width-field" for="width">Screen width
      <select id="width">
        <option value="320">320 px phone</option>
        <option value="390" selected>390 px phone</option>
        <option value="768">768 px tablet</option>
      </select>
    </label>

    <div class="frame" id="frame">
      <div class="top">
        <span class="icon" aria-hidden="true">M</span>
        <h2 class="page-title" id="title">Media sources and history</h2>
      </div>
    </div>
    <p class="muted" id="note" aria-live="polite"></p>
  </section>
  <p class="demo-pretend">This is a demonstration with pretend data. Nothing is saved.</p>
  <div class="row"><button type="button" class="tonal" data-demo-reset>Start again</button></div>
</main>
<script>
(function () {
  var before = document.getElementById("before");
  var after = document.getElementById("after");
  var width = document.getElementById("width");
  var frame = document.getElementById("frame");
  var title = document.getElementById("title");
  var note = document.getElementById("note");

  function render(oldBuild) {
    frame.style.width = width.value + "px";
    if (oldBuild) {
      title.style.width = "1ch";
      title.style.wordBreak = "break-all";
      note.textContent = "Build 536: the title has no width of its own in the top bar, so it collapses and each letter stacks on its own line.";
    } else {
      title.style.width = "";
      title.style.wordBreak = "normal";
      note.textContent = "Build 542: the title keeps its width and wraps onto a second line when it has to.";
    }
    before.setAttribute("aria-pressed", String(oldBuild));
    after.setAttribute("aria-pressed", String(!oldBuild));
  }

  before.addEventListener("click", function () { render(true); });
  after.addEventListener("click", function () { render(false); });
  width.addEventListener("change", function () { render(before.getAttribute("aria-pressed") === "true"); });
  document.querySelector("[data-demo-reset]").addEventListener("click", function () {
    width.value = "390";
    render(false);
  });
  render(false);
})();
</script>
</body>
</html>
