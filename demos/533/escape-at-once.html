<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo: Escape closes it at once</title>
<link rel="stylesheet" href="../../assets/demo.css">
<style>
.panel { width: 100%; max-width: 560px; margin: 16px auto 0; }
.row button { min-height: 48px; }
.box { border: 2px solid var(--outline, #8884); border-radius: 16px; padding: 16px; margin: 12px 0; }
.box:focus { outline: 3px solid var(--primary, #06c); outline-offset: 2px; }
</style>
</head>
<body>
<main class="demo" data-demo="escape-at-once">
  <h1>Escape closes it at once</h1>
  <p class="muted">A demonstration of a pretend confirmation. It does nothing to any system, and nothing is saved or sent.</p>

  <div class="row" role="group" aria-label="Which build behaves this way">
    <button type="button" class="chip" id="before" aria-pressed="false">Build 532</button>
    <button type="button" class="chip" id="after" aria-pressed="true">Build 533</button>
  </div>

  <section class="panel card" aria-live="polite">
    <div class="row"><button type="button" class="tonal" id="open">Open the confirmation</button></div>
    <div class="box" id="box" tabindex="-1" hidden>
      <p><strong>Pretend confirmation</strong></p>
      <p class="muted">Press Escape now, without pressing Tab first.</p>
      <div class="row"><button type="button" class="tonal" id="cancel">Cancel</button></div>
    </div>
    <p id="note" class="muted">Open it, then press Escape.</p>
  </section>
  <p class="demo-pretend">This is a demonstration with pretend data. Nothing is saved.</p>
  <div class="row"><button type="button" class="tonal" data-demo-reset>Start again</button></div>
</main>
<script>
let fixed = true;
const before = document.getElementById("before");
const after = document.getElementById("after");
const box = document.getElementById("box");
const note = document.getElementById("note");
const open = document.getElementById("open");
function close(text) {
  box.hidden = true;
  note.textContent = text;
}
function pick(value) {
  fixed = value;
  before.setAttribute("aria-pressed", String(!fixed));
  after.setAttribute("aria-pressed", String(fixed));
  close("Open it, then press Escape.");
}
before.addEventListener("click", () => pick(false));
after.addEventListener("click", () => pick(true));
open.addEventListener("click", () => {
  box.hidden = false;
  if (fixed) {
    document.getElementById("cancel").focus();
    note.textContent = "Focus moved inside. Escape will close it.";
  } else {
    open.blur();
    note.textContent = "Focus stayed on the page. Escape does nothing until you press Tab.";
  }
});
document.addEventListener("keydown", (event) => {
  if (event.key !== "Escape" || box.hidden) return;
  if (fixed || box.contains(document.activeElement)) {
    close("Closed by Escape. Nothing was changed.");
  } else {
    note.textContent = "Escape was pressed and ignored, because focus was outside. This is the fault that was found.";
  }
});
document.getElementById("cancel").addEventListener("click", () => close("Closed by Cancel. Nothing was changed."));
document.querySelector("[data-demo-reset]").addEventListener("click", () => pick(true));
</script>
</body>
</html>
