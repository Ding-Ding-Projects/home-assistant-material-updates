<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo: typed running version</title>
<link rel="stylesheet" href="../../assets/demo.css">
</head>
<body>
<main class="demo" data-demo="whats-new-typed-version">
  <h1>Type a version and watch the button appear or go</h1>
  <p class="muted">The button follows the running version as you type. A version with no build number at its end shows no button.</p>

  <section class="card stack" aria-labelledby="wt-h">
    <label class="field" for="wt-in">Running version</label>
    <input type="text" id="wt-in" value="2026.11.1.512" autocomplete="off" spellcheck="false">
    <p id="wt-msg" class="small muted" aria-live="polite"></p>
  </section>

  <section class="card tonal stack" aria-labelledby="wt-h2">
    <h2 id="wt-h2" class="small">Updates</h2>
    <div class="row">
      <button type="button" class="tonal" id="wt-btn" hidden>What's new in build</button>
    </div>
    <p id="wt-out" class="note" aria-live="polite"></p>
  </section>

  <p class="demo-pretend">This is a demonstration with pretend data. Nothing is saved.</p>
  <div class="row"><button type="button" class="tonal" data-demo-reset>Start again</button></div>
</main>
<script>
(function () {
  var input = document.getElementById('wt-in');
  var btn = document.getElementById('wt-btn');
  var msg = document.getElementById('wt-msg');
  var out = document.getElementById('wt-out');
  var build = null;

  function update() {
    var v = input.value.trim();
    var m = /\.(\d+)$/.exec(v);
    if (m) {
      build = m[1];
      btn.hidden = false;
      btn.textContent = "What's new in build " + build;
      msg.textContent = 'The button is shown for build ' + build + '.';
      out.textContent = 'Pressing it would open build ' + build + ' on the updates log.';
    } else {
      build = null;
      btn.hidden = true;
      msg.textContent = 'No button: "' + v + '" has no build number at its end.';
      out.textContent = '';
    }
  }

  input.addEventListener('input', update);
  btn.addEventListener('click', function () {
    if (build) out.textContent = 'Would open build ' + build + ' on the updates log.';
  });
  document.querySelector('[data-demo-reset]').addEventListener('click', function () {
    input.value = '2026.11.1.512';
    update();
  });

  update();
})();
</script>
</body>
</html>
