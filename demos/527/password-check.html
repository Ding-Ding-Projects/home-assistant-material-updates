<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo: the stricter password check</title>
<link rel="stylesheet" href="../../assets/demo.css">
<style>
.tries { display: flex; flex-wrap: wrap; gap: 8px; }
.tries button { min-height: 48px; }
.tries button[aria-pressed="true"] { background: var(--sc); color: var(--on-sc); border-color: transparent; font-weight: 500; }
.panel { width: 100%; max-width: 560px; margin: 16px auto 0; }
.verdict { font-weight: 600; font-size: 18px; margin: 0 0 6px; }
.mono { font-family: ui-monospace, Consolas, monospace; }
</style>
</head>
<body>
<main class="demo" data-demo="password-check">
  <h1>The stricter password check</h1>
  <p class="muted">A demonstration with fixed examples and the figures measured in testing. It does not run the real check, and nothing is saved or sent.</p>

  <div class="tries" role="group" aria-label="Example passwords">
    <button type="button" class="chip" aria-pressed="false" data-i="0">Word, year, word</button>
    <button type="button" class="chip" aria-pressed="false" data-i="1">Keyboard run</button>
    <button type="button" class="chip" aria-pressed="false" data-i="2">Famous phrase</button>
    <button type="button" class="chip" aria-pressed="false" data-i="3">Name and birthday</button>
    <button type="button" class="chip" aria-pressed="false" data-i="4">Five uncommon words</button>
  </div>

  <section class="panel card" aria-live="polite">
    <p class="verdict" id="verdict">Press an example.</p>
    <p class="mono" id="sample"></p>
    <p id="why" class="muted"></p>
  </section>
  <p class="demo-pretend">This is a demonstration with pretend data. Nothing is saved.</p>
  <div class="row"><button type="button" class="tonal" data-demo-reset>Start again</button></div>
</main>
<script>
const rows = [
  ["Capitalword2024word", "33 bits. Refused.", "A dictionary word, a year and another word. Before this build it passed, because only length and kinds of character were counted."],
  ["1qaz2wsx3edc4rfv", "37 bits. Refused.", "Columns of the keyboard typed in order. It looks random and is not."],
  ["correct horse battery staple", "11 bits. Refused.", "A phrase everybody has read. Known phrases are on the list."],
  ["Michael19851225!", "28 bits. Refused.", "A common name, a date and an exclamation mark at the end."],
  ["obsidian marmalade tundra gazebo nutmeg", "88 bits. Accepted.", "Five uncommon words with nothing joining them. The bar is 60 bits."]
];
const buttons = document.querySelectorAll(".tries button");
buttons.forEach((b) => b.addEventListener("click", () => {
  buttons.forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  const r = rows[Number(b.dataset.i)];
  document.getElementById("sample").textContent = r[0];
  document.getElementById("verdict").textContent = r[1];
  document.getElementById("why").textContent = r[2];
}));
document.querySelector("[data-demo-reset]").addEventListener("click", () => {
  buttons.forEach((x) => x.setAttribute("aria-pressed", "false"));
  document.getElementById("sample").textContent = "";
  document.getElementById("verdict").textContent = "Press an example.";
  document.getElementById("why").textContent = "";
});
</script>
</body>
</html>
